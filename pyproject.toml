[build-system]
requires = ["setuptools>=75,<83", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-red"
version = "0.1.0"
description = "Agent-native autonomous post-training research tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
ray = ["ray[default]==2.59.0"]
kubernetes = ["kubernetes>=30,<40"]

[project.scripts]
rsi = "rsi_red.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rsi_red = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["src", "."]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
