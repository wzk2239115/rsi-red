name: Simulation delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  simulate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Simulated CPU research campaign
        run: rsi demo --output "$RUNNER_TEMP/simulated-campaign" --json
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-campaign-evidence
          path: ${{ runner.temp }}/simulated-campaign/report.json
          if-no-files-found: error
