name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  paper-mechanism-contracts:
    name: paper-mechanism-${{ matrix.os }}-py3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -e . -r requirements-dev.txt
      - name: Accepted papers, atomic mechanisms and evidence-only relations (RED until approved)
        run: python -m pytest contracts/paper_library -v --import-mode=importlib --junitxml=reports/paper-library-junit.xml
      - name: Annotate paper library failures
        if: failure()
        run: python scripts/annotate_junit.py reports/paper-library-junit.xml
      - name: Preserve paper library evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-mechanism-${{ matrix.os }}
          path: reports/paper-library-junit.xml
          if-no-files-found: error

  paper-library-batch-http:
    name: paper-library-1000-records-and-http
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NO_PROXY: '127.0.0.1,localhost'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -e . -r requirements-dev.txt
      - name: Resumable 1000-paper fixture, concurrency bound and actual HTTP adapter (RED)
        run: python -m pytest contracts/paper_library_io -v --import-mode=importlib --junitxml=reports/paper-library-io-junit.xml
      - name: Annotate bulk and HTTP failures
        if: failure()
        run: python scripts/annotate_junit.py reports/paper-library-io-junit.xml
      - name: Preserve bulk and HTTP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-library-batch-http
          path: reports/paper-library-io-junit.xml
          if-no-files-found: error

  benchmark-runner-contracts:
    name: benchmark-runner-${{ matrix.os }}-py3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Immutable runner, recovery, privacy and external CPU execution contracts
        run: python -m pytest contracts/benchmark_runner -v --junitxml=reports/runner-junit.xml
      - name: Annotate runner contract failures
        if: failure()
        run: python scripts/annotate_junit.py reports/runner-junit.xml
      - name: Preserve runner contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runner-${{ matrix.os }}
          path: reports/runner-junit.xml
          if-no-files-found: error

  benchmark-runner-ray-contracts:
    name: benchmark-runner-real-ray-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAY_USAGE_STATS_ENABLED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - run: python -m pip install -e '.[ray]' -r requirements-dev.txt
      - name: Runner lifecycle on actual Ray CPU
        run: python -m pytest contracts/benchmark_runner_ray -v --junitxml=reports/runner-ray-junit.xml
      - name: Annotate Ray runner failures
        if: failure()
        run: python scripts/annotate_junit.py reports/runner-ray-junit.xml
      - name: Preserve Ray runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-runner-real-ray-cpu
          path: |
            reports/runner-ray-junit.xml
            reports/ray-logs/
          if-no-files-found: error

  evaluation-direction-contracts:
    name: evaluation-direction-${{ matrix.os }}-py3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Human-authorized benchmark direction contracts
        run: python -m pytest contracts/evaluation_direction -v --junitxml=reports/direction-junit.xml
      - name: Annotate direction contract failures
        if: failure()
        run: python scripts/annotate_junit.py reports/direction-junit.xml
      - name: Preserve direction contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-direction-${{ matrix.os }}
          path: reports/direction-junit.xml
          if-no-files-found: error

  tests:
    name: contracts-${{ matrix.os }}-py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lint tests and tooling
        run: python -m ruff check .
      - name: Run behavior and process tests (failures block release)
        run: python -m pytest tests --junitxml=reports/junit.xml
      - name: Annotate behavior test failures
        if: failure()
        run: python scripts/annotate_junit.py reports/junit.xml
      - name: Preserve failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/junit.xml
          if-no-files-found: error
      - name: Build and check installed wheel in a fresh environment
        shell: bash
        run: |
          python -m build
          python -m venv "$RUNNER_TEMP/rsi-wheel-check"
          "$RUNNER_TEMP/rsi-wheel-check/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/rsi-wheel-check/bin/rsi" --help
          "$RUNNER_TEMP/rsi-wheel-check/bin/rsi" --version
          "$RUNNER_TEMP/rsi-wheel-check/bin/rsi" kanban --help
          "$RUNNER_TEMP/rsi-wheel-check/bin/rsi" audit --help
          "$RUNNER_TEMP/rsi-wheel-check/bin/rsi" eval model --help
          "$RUNNER_TEMP/rsi-wheel-check/bin/rsi" init --profile ray-peers --with-auditor --output "$RUNNER_TEMP/rsi-installed-peers" --json
          "$RUNNER_TEMP/rsi-wheel-check/bin/python" -c "from importlib.resources import files; assert all(files('rsi_red').joinpath('web', name).is_file() for name in ['index.html', 'app.js', 'style.css'])"
          "$RUNNER_TEMP/rsi-wheel-check/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_runtime.py"
          "$RUNNER_TEMP/rsi-wheel-check/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_runner.py"
          "$RUNNER_TEMP/rsi-wheel-check/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_installed_papers.py"
          "$RUNNER_TEMP/rsi-wheel-check/bin/rsi" demo --output "$RUNNER_TEMP/rsi-installed-demo" --json

  ray-integration:
    name: ray-jobs-ubuntu-py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAY_USAGE_STATS_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install pinned real Ray Jobs runtime
        run: python -m pip install -e '.[ray]' -r requirements-dev.txt
      - name: Test real local Ray Jobs server (CPU only)
        run: python -m pytest integration/ray -v --junitxml=reports/ray-junit.xml
      - name: Annotate Ray test failures
        if: failure()
        run: python scripts/annotate_junit.py reports/ray-junit.xml
      - name: Preserve Ray test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ray-integration-diagnostics
          path: |
            reports/ray-junit.xml
            reports/ray-logs/
          if-no-files-found: error

  research-islands-contracts:
    name: research-islands-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Research-layer TDD contracts (RED until implemented)
        run: python -m pytest contracts/research_islands -v --junitxml=reports/islands-junit.xml
      - name: Preserve research contract failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-islands-contracts
          path: reports/islands-junit.xml
          if-no-files-found: error

  lightweight-ray-peers-contracts:
    name: lightweight-ray-peers-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Lightweight deployment behavior contracts
        run: python -m pytest contracts/ray_peer_profile -v --junitxml=reports/ray-peer-profile-junit.xml
      - name: Annotate deployment contract failures
        if: failure()
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path("reports/ray-peer-profile-junit.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  for failure in list(case.findall("failure")) + list(case.findall("error")):
                      message = (failure.text or failure.get("message", ""))[-5000:]
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=Deployment contract {case.get('name')}::{message}")
          PYCODE
      - name: Preserve lightweight deployment contract failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-ray-peers-contracts
          path: reports/ray-peer-profile-junit.xml
          if-no-files-found: error

  evaluation-integrity-contracts:
    name: evaluation-integrity-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Evaluation integrity and no-disclosure contracts
        run: python -m pytest contracts/evaluation_integrity -v --junitxml=reports/audit-contract-junit.xml
      - name: Preserve evaluation integrity contract failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-integrity-contracts
          path: reports/audit-contract-junit.xml
          if-no-files-found: error

  flexible-training-contracts:
    name: flexible-training-${{ matrix.os }}-py3.12
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Open training behavior and runtime contracts
        run: python -m pytest contracts/flexible_training -v --junitxml=reports/flexible-training-junit.xml
      - name: Annotate flexible training failures
        if: failure()
        run: python scripts/annotate_junit.py reports/flexible-training-junit.xml
      - name: Preserve flexible training contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexible-training-${{ matrix.os }}
          path: reports/flexible-training-junit.xml
          if-no-files-found: error

  flexible-training-ray-contracts:
    name: flexible-training-real-ray-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAY_USAGE_STATS_ENABLED: '0'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install actual pinned Ray runtime
        run: python -m pip install -e '.[ray]' -r requirements-dev.txt
      - name: Task environments, outputs and recovery on real Ray
        run: python -m pytest contracts/flexible_training_ray -v --junitxml=reports/flexible-training-ray-junit.xml
      - name: Annotate Ray training contract failures
        if: failure()
        run: python scripts/annotate_junit.py reports/flexible-training-ray-junit.xml
      - name: Preserve Ray training contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flexible-training-real-ray-cpu
          path: |
            reports/flexible-training-ray-junit.xml
            reports/ray-logs/
          if-no-files-found: error
